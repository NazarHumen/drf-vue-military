{% load static %}

<div>
    <div>
        <a href="{% url 'favorites:list' %}"
           class="btn btn-dark btn-secondary d-flex">
            <img class="mx-1" src="{% static 'deps/images/heart.svg' %}"
                 alt="Favorites Icon" width="24" height="24">
            <span class="favorites-count">{{ favorites_count }}</span>
        </a>


    </div>
</div>

<div class="modal fade" id="favoritesModal" tabindex="-1"
     aria-labelledby="favoritesModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <h3 class="text-center mb-4">Обрані товари</h3>
                <div class="container" id="favorites-items-container">
                </div>
            </div>
        </div>
    </div>
</div>
